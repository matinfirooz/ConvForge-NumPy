<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="485" viewBox="0 0 1280 485" role="img" aria-label="ConvForge: a trainable CNN implemented entirely in NumPy">
<title>ConvForge: a trainable CNN implemented entirely in NumPy</title>
<rect width="1280" height="485" rx="18" fill="#0a101c"/>
<text x="48" y="46" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#69e3bf" font-weight="700" text-anchor="start" letter-spacing="2">MATINFIROOZ / CONVFORGE-NUMPY</text>
<text x="45" y="118" font-family="DejaVu Sans,Arial,sans-serif" font-size="44" fill="#edf2fa" font-weight="700" text-anchor="start" >A CNN. Every operation exposed.</text>
<text x="48" y="158" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#98aac0" font-weight="400" text-anchor="start" >Pixels → learned filters → feature maps → predictions → manual gradients</text>
<rect x="48" y="209" width="277" height="143" rx="7" fill="#151f30" />
<text x="66" y="237" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#69e3bf" font-weight="700" text-anchor="start" >01 / INPUT</text>
<text x="66" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#edf2fa" font-weight="700" text-anchor="start" >1 × 24 × 24</text>
<text x="66" y="321" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#98aac0" font-weight="400" text-anchor="start" >noisy silhouettes</text>
<line x1="328" y1="279" x2="349" y2="279" stroke="#69e3bf" stroke-width="2"/>
<polyline points="343.00,274.00 349.00,279.00 343.00,284.00" fill="none" stroke="#69e3bf" stroke-width="3" stroke-linejoin="round"/>
<rect x="353" y="209" width="277" height="143" rx="7" fill="#151f30" />
<text x="371" y="237" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#69e3bf" font-weight="700" text-anchor="start" >02 / CONV + POOL</text>
<text x="371" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#edf2fa" font-weight="700" text-anchor="start" >8 × 12 × 12</text>
<text x="371" y="321" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#98aac0" font-weight="400" text-anchor="start" >learn local patterns</text>
<line x1="633" y1="279" x2="654" y2="279" stroke="#69e3bf" stroke-width="2"/>
<polyline points="648.00,274.00 654.00,279.00 648.00,284.00" fill="none" stroke="#69e3bf" stroke-width="3" stroke-linejoin="round"/>
<rect x="658" y="209" width="277" height="143" rx="7" fill="#151f30" />
<text x="676" y="237" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#69e3bf" font-weight="700" text-anchor="start" >03 / CONV + POOL</text>
<text x="676" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#edf2fa" font-weight="700" text-anchor="start" >16 × 6 × 6</text>
<text x="676" y="321" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#98aac0" font-weight="400" text-anchor="start" >combine features</text>
<line x1="938" y1="279" x2="959" y2="279" stroke="#69e3bf" stroke-width="2"/>
<polyline points="953.00,274.00 959.00,279.00 953.00,284.00" fill="none" stroke="#69e3bf" stroke-width="3" stroke-linejoin="round"/>
<rect x="963" y="209" width="277" height="143" rx="7" fill="#151f30" />
<text x="981" y="237" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#69e3bf" font-weight="700" text-anchor="start" >04 / CLASSIFIER</text>
<text x="981" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#edf2fa" font-weight="700" text-anchor="start" >32 → 6</text>
<text x="981" y="321" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#98aac0" font-weight="400" text-anchor="start" >choose a shape</text>
<text x="48" y="406" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#69e3bf" font-weight="700" text-anchor="start" >NUMPY ONLY</text>
<text x="267" y="406" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#ffb478" font-weight="700" text-anchor="start" >MANUAL BACKPROP</text>
<text x="560" y="406" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#beaaff" font-weight="700" text-anchor="start" >LIVE DRAWING LAB</text>
<text x="898" y="406" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#69e3bf" font-weight="700" text-anchor="start" >19,910 PARAMETERS</text>
<text x="48" y="452" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#98aac0" font-weight="400" text-anchor="start" >Train it. Trace it. Differentiate it. See what its filters learn.</text>
</svg>
